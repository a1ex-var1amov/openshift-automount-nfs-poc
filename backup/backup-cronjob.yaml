apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-directories-backup
  namespace: automount-nfs-poc
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          containers:
          - name: backup-agent
            image: quay.io/backup-agent:latest
            command: ["/bin/bash", "-c"]
            args:
            - |
              set -e
              
              # Configuration
              BACKUP_DIR="/backup/home-$(date +%Y%m%d-%H%M%S)"
              RETENTION_DAYS=30
              
              echo "Starting backup of home directories at $(date)"
              
              # Create backup directory
              mkdir -p "$BACKUP_DIR"
              
              # Backup user home directories
              if [ -d "/mnt/home" ]; then
                echo "Backing up home directories from NFS mount..."
                rsync -av --delete /mnt/home/ "$BACKUP_DIR/"
                
                # Verify backup
                if [ $? -eq 0 ]; then
                  echo "Backup completed successfully"
                  
                  # Create backup manifest
                  cat > "$BACKUP_DIR/backup-manifest.json" << EOF
              {
                "timestamp": "$(date -Iseconds)",
                "source": "/mnt/home",
                "destination": "$BACKUP_DIR",
                "user_count": $(ls /mnt/home | wc -l),
                "backup_size": $(du -sb "$BACKUP_DIR" | cut -f1)
              }
              EOF
                  
                  # Upload to S3 or other storage
                  if command -v aws >/dev/null 2>&1; then
                    echo "Uploading backup to S3..."
                    aws s3 sync "$BACKUP_DIR" "s3://home-backups/$(date +%Y/%m/%d)/" --delete
                  fi
                  
                else
                  echo "Backup failed!"
                  exit 1
                fi
              else
                echo "ERROR: NFS mount not available for backup"
                exit 1
              fi
              
              # Cleanup old backups
              echo "Cleaning up backups older than $RETENTION_DAYS days..."
              find /backup -name "home-*" -type d -mtime +$RETENTION_DAYS -exec rm -rf {} \;
              
              echo "Backup process completed at $(date)"
            volumeMounts:
            - name: nfs-mount
              mountPath: /mnt/home
              readOnly: true
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: nfs-mount
            hostPath:
              path: /var/mnt/home
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-storage-pvc
          restartPolicy: OnFailure
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage-pvc
  namespace: automount-nfs-poc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: gp2
