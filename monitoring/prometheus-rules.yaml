apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-access-alerts
  namespace: automount-nfs-poc
  labels:
    app: home-access
    prometheus: kube-prometheus
spec:
  groups:
  - name: home-access.rules
    rules:
    - alert: HomeDirectoryUnavailable
      expr: nfs_mount_available == 0
      for: 1m
      labels:
        severity: critical
        component: home-access
      annotations:
        summary: "NFS mount is not available"
        description: "The NFS mount for home directories has been unavailable for more than 1 minute"
        
    - alert: UserHomeInaccessible
      expr: user_home_accessible == 0
      for: 2m
      labels:
        severity: warning
        component: home-access
      annotations:
        summary: "User home directory is not accessible"
        description: "User home directory symlinks are not working properly"
        
    - alert: HomeDirectoryCountLow
      expr: home_directories_total < 5
      for: 5m
      labels:
        severity: warning
        component: home-access
      annotations:
        summary: "Low number of home directories detected"
        description: "Only {{ $value }} home directories are available, expected at least 5"
        
    - alert: HomeAccessPodDown
      expr: up{job="home-access"} == 0
      for: 1m
      labels:
        severity: critical
        component: home-access
      annotations:
        summary: "Home access pod is down"
        description: "The home access pod has been down for more than 1 minute"
        
    - alert: HomeAccessHighMemoryUsage
      expr: container_memory_usage_bytes{pod=~"test-pod-hardened-.*"} / container_spec_memory_limit_bytes{pod=~"test-pod-hardened-.*"} > 0.8
      for: 5m
      labels:
        severity: warning
        component: home-access
      annotations:
        summary: "High memory usage in home access pod"
        description: "Memory usage is above 80% for more than 5 minutes"
        
    - alert: HomeAccessHighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{pod=~"test-pod-hardened-.*"}[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
        component: home-access
      annotations:
        summary: "High CPU usage in home access pod"
        description: "CPU usage is above 80% for more than 5 minutes"
