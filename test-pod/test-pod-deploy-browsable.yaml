apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-browsable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-pod-browsable
  template:
    metadata:
      labels:
        app: test-pod-browsable
    spec:
      securityContext:
        runAsUser: 2002
        runAsGroup: 2002
        supplementalGroups: [2002]
      containers:
      - name: home-browser
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        securityContext:
          runAsUser: 2002
          runAsGroup: 2002
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Create a browsable home directory by creating individual symlinks
          # This bypasses the autofs SELinux browsing limitation
          mkdir -p /shared/home-browsable
          
          # Function to create symlink for a user if their directory exists
          create_home_symlink() {
            local username=$1
            if [ -d "/home/$username" ]; then
              ln -sf "/home/$username" "/shared/home-browsable/$username"
              echo "✓ Created symlink for $username"
            else
              echo "✗ Directory /home/$username not found"
            fi
          }
          
          # Create symlinks for all users
          for user in usera userb userc userd usere xyz; do
            create_home_symlink "$user"
          done
          
          # Set proper permissions
          chmod 755 /shared/home-browsable
          chown 2002:2002 /shared/home-browsable
          
          echo "Browsable home directory created at /shared/home-browsable"
          ls -la /shared/home-browsable
          
          # Keep the container running
          sleep infinity
        volumeMounts:
        - name: host-home
          mountPath: /home
          mountPropagation: HostToContainer
        - name: shared-home
          mountPath: /shared
      - name: test-pod
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        workingDir: /tmp
        command: ["/bin/bash","-lc"]
        args:
        - |
          id
          echo "=== BROWSABLE HOME SOLUTION TEST ==="
          echo "=== Testing /home directory access ==="
          ls -la /home || echo "Cannot browse /home (SELinux limitation)"
          echo "=== Testing browsable home directory ==="
          ls -la /home-browsable/
          echo "=== Testing individual directories ==="
          ls -la /home/userb
          ls -la /home/xyz
          echo "=== Testing file operations ==="
          echo $(date) hello from browsable:$HOSTNAME >> /home/userb/hello.txt
          echo $(date) hello shared from browsable:$HOSTNAME >> /home/xyz/hello.txt
          echo "=== Testing write permissions ==="
          echo "test write" > /home/userb/test-write.txt
          ls -la /home/userb/test-write.txt
          sleep infinity
        volumeMounts:
        - name: host-home
          mountPath: /home
          mountPropagation: HostToContainer
        - name: shared-home
          mountPath: /home-browsable
          subPath: home-browsable
      serviceAccountName: test-pod
      volumes:
      - name: host-home
        hostPath:
          path: /var/mnt/home
      - name: shared-home
        emptyDir: {}
