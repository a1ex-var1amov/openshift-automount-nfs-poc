apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-final
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-pod-final
  template:
    metadata:
      labels:
        app: test-pod-final
    spec:
      securityContext:
        runAsUser: 2002
        runAsGroup: 2002
        supplementalGroups: [2002]
      initContainers:
      - name: nfs-mounter
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        securityContext:
          runAsUser: 2002
          runAsGroup: 2002
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install NFS utilities
          dnf install -y nfs-utils
          
          # Create mount point
          mkdir -p /shared/home
          
          # Mount NFS directly with proper SELinux context
          mount -t nfs -o rw,vers=3,context=system_u:object_r:user_home_t:s0 172.30.240.59:/exports/home /shared/home
          
          # Set proper permissions
          chmod 755 /shared/home
          chown 2002:2002 /shared/home
          
          # Show mount information
          mount | grep nfs
          ls -la /shared/home
        volumeMounts:
        - name: shared-home
          mountPath: /shared/home
      containers:
      - name: test-pod
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        workingDir: /tmp
        command: ["/bin/bash","-lc"]
        args:
        - |
          id
          echo "=== FINAL SOLUTION TEST ==="
          echo "=== Testing /home directory access ==="
          ls -la /home
          echo "=== Testing individual directories ==="
          ls -la /home/userb
          ls -la /home/xyz
          echo "=== Testing file operations ==="
          echo $(date) hello from final:$HOSTNAME >> /home/userb/hello.txt
          echo $(date) hello shared from final:$HOSTNAME >> /home/xyz/hello.txt
          echo "=== Testing write permissions ==="
          echo "test write" > /home/userb/test-write.txt
          ls -la /home/userb/test-write.txt
          sleep infinity
        volumeMounts:
        - name: shared-home
          mountPath: /home
      serviceAccountName: test-pod
      volumes:
      - name: shared-home
        emptyDir: {}
