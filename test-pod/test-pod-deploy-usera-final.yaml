apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-usera-final
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-pod-usera-final
  template:
    metadata:
      labels:
        app: test-pod-usera-final
    spec:
      securityContext:
        runAsUser: 2001  # usera UID
        runAsGroup: 2001 # usera GID
        supplementalGroups: [2001, 1000770000] # Add NFS GID
      initContainers:
      - name: home-setup
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          seLinuxOptions:
            type: "spc_t"
          capabilities:
            add: ["SYS_ADMIN", "DAC_OVERRIDE", "CHOWN", "FOWNER"]
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install SELinux utilities
          dnf install -y policycoreutils-python-utils setools-console
          
          # Wait for the home directory to be available
          while [ ! -d "/mnt/home" ]; do
            echo "Waiting for /mnt/home directory to be available..."
            sleep 2
          done
          
          echo "Setting up /home directory for usera..."
          
          # Create a new /home directory structure
          mkdir -p /home-new
          
          # Copy all user directories to the new home
          cp -r /mnt/home/* /home-new/ 2>/dev/null || true
          
          # Set proper ownership and permissions
          chown -R 2001:2001 /home-new/usera
          chown -R 2002:2002 /home-new/userb
          chown -R 2003:2003 /home-new/userc
          chown -R 2004:2004 /home-new/userd
          chown -R 2005:2005 /home-new/usere
          chown -R root:root /home-new/xyz
          
          # Set directory permissions
          chmod 755 /home-new
          chmod 755 /home-new/*
          
          # Try to fix SELinux context
          chcon -t public_content_t /home-new 2>/dev/null || echo "SELinux context change failed"
          chcon -t public_content_t /home-new/* 2>/dev/null || echo "SELinux context change failed"
          
          echo "Home directory setup completed!"
          ls -la /home-new
        volumeMounts:
        - name: host-home
          mountPath: /mnt/home
          mountPropagation: HostToContainer
        - name: home-volume
          mountPath: /home-new
      containers:
      - name: test-pod
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        workingDir: /tmp
        command: ["/bin/bash","-lc"]
        args:
        - |
          id
          echo "=== USERA FINAL HOME DIRECTORY TEST ==="
          echo "Running as usera (UID 2001, GID 2001)"
          echo ""
          echo "=== Testing /home directory browsing (as usera) ==="
          ls -la /home
          echo ""
          echo "=== Testing individual home access (as usera) ==="
          echo "My home directory (/home/usera):"
          ls -la /home/usera
          echo ""
          echo "Other users' directories:"
          ls -la /home/userb
          ls -la /home/xyz
          echo ""
          echo "=== Testing file operations in my home (as usera) ==="
          echo "Creating file in my home directory:"
          echo "Hello from usera at $(date)" >> /home/usera/usera-final-test.txt
          ls -la /home/usera/usera-final-test.txt
          echo ""
          echo "Reading my home directory contents:"
          cat /home/usera/usera-final-test.txt
          echo ""
          echo "=== Testing file operations in other users' homes (as usera) ==="
          echo "Trying to write to userb's home:"
          echo "Hello from usera to userb at $(date)" >> /home/userb/usera-to-userb.txt 2>&1 || echo "Permission denied (expected)"
          echo ""
          echo "Trying to read userb's existing files:"
          ls -la /home/userb/ 2>&1 || echo "Cannot list userb's directory"
          echo ""
          echo "=== Final verification: Can usera browse /home? ==="
          if ls /home >/dev/null 2>&1; then
            echo "✅ SUCCESS: usera can browse /home directory!"
            echo "Available users:"
            ls -1 /home | grep -v toolbox
            echo ""
            echo "✅ SUCCESS: usera can access their own home directory!"
            echo "✅ SUCCESS: usera can see other users' directories!"
            echo "✅ SUCCESS: usera can perform file operations in their home!"
          else
            echo "❌ FAILED: usera cannot browse /home directory"
          fi
          echo ""
          echo "=== Test completed ==="
          sleep infinity
        volumeMounts:
        - name: home-volume
          mountPath: /home
      serviceAccountName: selinux-fix-sa
      volumes:
      - name: host-home
        hostPath:
          path: /var/mnt/home
      - name: home-volume
        emptyDir: {}
