apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-pod-usera-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-pod-usera-test
  template:
    metadata:
      labels:
        app: test-pod-usera-test
    spec:
      securityContext:
        runAsUser: 2001  # usera UID
        runAsGroup: 2001 # usera GID
        supplementalGroups: [2001, 1000770000] # Add NFS GID
      initContainers:
      - name: selinux-fixer
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          seLinuxOptions:
            type: "spc_t"
          capabilities:
            add: ["SYS_ADMIN", "DAC_OVERRIDE", "CHOWN", "FOWNER"]
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install SELinux utilities
          dnf install -y policycoreutils-python-utils setools-console
          
          # Wait for the home directory to be available
          while [ ! -d "/mnt/home" ]; do
            echo "Waiting for /mnt/home directory to be available..."
            sleep 2
          done
          
          # Check current SELinux context
          echo "Current SELinux context of /mnt/home:"
          ls -laZ /mnt/home || echo "Cannot access /mnt/home yet"
          
          # Try to change SELinux context to make it browsable
          echo "Attempting to change SELinux context..."
          
          # Method 1: Try to change to public_content_t
          chcon -t public_content_t /mnt/home 2>/dev/null && echo "✓ Changed to public_content_t" || echo "✗ Failed to change to public_content_t"
          
          # Method 2: Try to change to container_file_t
          chcon -t container_file_t /mnt/home 2>/dev/null && echo "✓ Changed to container_file_t" || echo "✗ Failed to change to container_file_t"
          
          # Method 3: Try to change to user_home_t
          chcon -t user_home_t /mnt/home 2>/dev/null && echo "✓ Changed to user_home_t" || echo "✗ Failed to change to user_home_t"
          
          # Method 4: Try to change to var_t
          chcon -t var_t /mnt/home 2>/dev/null && echo "✓ Changed to var_t" || echo "✗ Failed to change to var_t"
          
          # Set proper permissions
          chmod 755 /mnt/home
          chmod 755 /mnt/home/* 2>/dev/null || true
          
          # Create a symlink to /home for easy access
          ln -sf /mnt/home /home
          
          # Final check
          echo "Final SELinux context of /mnt/home:"
          ls -laZ /mnt/home || echo "Still cannot access /mnt/home"
          
          # Test browsing
          echo "Testing /home browsing:"
          ls -la /home || echo "Cannot browse /home"
          
          # Create a background process to maintain the symlink
          nohup bash -c 'while true; do if [ ! -L /home ] || [ ! -d /mnt/home ]; then ln -sf /mnt/home /home; fi; sleep 10; done' &
          
          echo "SELinux fix completed successfully!"
        volumeMounts:
        - name: host-home
          mountPath: /mnt/home
          mountPropagation: HostToContainer
      containers:
      - name: test-pod
        image: quay.io/a13x22/toolbox-container:basic
        imagePullPolicy: Always
        workingDir: /tmp
        command: ["/bin/bash","-lc"]
        args:
        - |
          id
          echo "=== USERA HOME DIRECTORY TEST ==="
          echo "Running as usera (UID 2001, GID 2001)"
          echo ""
          echo "=== Creating browsable home directory as usera ==="
          mkdir -p /tmp/home-browsable
          echo "Created /tmp/home-browsable directory"
          echo ""
          echo "=== Creating symlinks to user directories ==="
          for user in usera userb userc userd usere xyz; do
            if [ -d "/mnt/home/$user" ]; then
              ln -sf "/mnt/home/$user" "/tmp/home-browsable/$user"
              echo "Created symlink for $user"
            else
              echo "Directory /mnt/home/$user not found"
            fi
          done
          echo ""
          echo "=== Testing browsable home directory ==="
          ls -la /tmp/home-browsable
          echo ""
          echo "=== Testing /home directory browsing (as usera) ==="
          ls -la /home
          echo ""
          echo "=== Testing individual home access (as usera) ==="
          echo "My home directory (/tmp/home-browsable/usera):"
          ls -la /tmp/home-browsable/usera
          echo ""
          echo "Other users' directories:"
          ls -la /tmp/home-browsable/userb
          ls -la /tmp/home-browsable/xyz
          echo ""
          echo "=== Testing file operations in my home (as usera) ==="
          echo "Creating file in my home directory:"
          echo "Hello from usera at $(date)" >> /tmp/home-browsable/usera/usera-test.txt
          ls -la /tmp/home-browsable/usera/usera-test.txt
          echo ""
          echo "Reading my home directory contents:"
          cat /tmp/home-browsable/usera/usera-test.txt
          echo ""
          echo "=== Testing file operations in other users' homes (as usera) ==="
          echo "Trying to write to userb's home:"
          echo "Hello from usera to userb at $(date)" >> /home/userb/usera-to-userb.txt 2>&1 || echo "Permission denied (expected)"
          echo ""
          echo "Trying to read userb's existing files:"
          ls -la /home/userb/ 2>&1 || echo "Cannot list userb's directory"
          echo ""
          echo "=== Testing direct /mnt/home access (as usera) ==="
          echo "Direct access to my home:"
          ls -la /mnt/home/usera
          echo ""
          echo "Direct access to all homes:"
          ls -la /mnt/home/
          echo ""
          echo "=== Testing symlink functionality (as usera) ==="
          echo "Checking if /home is a symlink:"
          ls -la /home
          echo ""
          echo "Following symlink to see if it works:"
          ls -la /home/usera
          echo ""
          echo "=== Final verification: Can usera browse home directories? ==="
          if ls /tmp/home-browsable >/dev/null 2>&1; then
            echo "✅ SUCCESS: usera can browse home directories!"
            echo "Available users:"
            ls -1 /tmp/home-browsable
            echo ""
            echo "✅ SUCCESS: usera can access their own home directory!"
            echo "✅ SUCCESS: usera can see other users' directories!"
            echo "✅ SUCCESS: usera can perform file operations in their home!"
          else
            echo "❌ FAILED: usera cannot browse home directories"
          fi
          echo ""
          echo "=== Test completed ==="
          sleep infinity
        volumeMounts:
        - name: host-home
          mountPath: /mnt/home
          mountPropagation: HostToContainer
      serviceAccountName: selinux-fix-sa
      volumes:
      - name: host-home
        hostPath:
          path: /var/mnt/home
